[[entry]]
id = 2
type = "story"
title = "Kill-switch soft-check ở dispatch"
description = """
Pre-flight best-effort check proxy của account trước khi chạy action khi REACH_ACCOUNT set: proxy check nhanh (HTTP HEAD/CONNECT qua REACH_BROWSER_PROXY, timeout ngắn ~5s, cache verdict ngắn ~60s để không làm chậm mọi action) → proxy fail → refuse `PLATFORM_BLOCKED` (zero egress — KHÔNG fallback direct, KHÔNG so IP tuyệt đối). Semantics theo đúng docs/farm-account-contract.md §2 layer-1; netns hard-enforce là của epic-fleet-orchestration, không implement ở đây. Skip check khi account không có proxy (proxy-less = direct, hợp lệ theo contract) và khi REACH_ACCOUNT unset (legacy path).
"""
verify = "Account có proxy http://127.0.0.1:1 (proxy chết) + REACH_ACCOUNT set → action refuse PLATFORM_BLOCKED fail-closed, không action nào chạy; account không proxy → chạy bình thường."
covers = ["R6"]
after = []
hitl = false
risk = "medium"

