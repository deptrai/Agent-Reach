id = 1
type = "story"
title = "Per-day quota enforcement"
description = """
Dispatch đọc caps per-account per-action_class per-day (env-configurable, ví dụ REACH_CAP_POST=10, REACH_CAP_REPLY=20, default chốt trong code) → query ledger_24h của epic 11.5 → vượt cap thì refuse TRƯỚC khi gọi platform (ReachError code phù hợp, message ghi rõ account + class + cap + count hiện tại). Chỉ áp cho write verbs (post/reply/quote/thread/share/comment/react/post-edit/post-delete) theo WRITE_ACTIONS map của 12.7; read actions không cap. Refusal phải surface lên operator qua JSON envelope (không nuốt).
"""
