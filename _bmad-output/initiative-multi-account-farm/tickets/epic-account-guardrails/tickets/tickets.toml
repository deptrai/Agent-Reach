title = "Warm-up ramp theo tuổi account"
description = """
Caps chặt dần theo tuổi: đọc field `age` (onboard epoch) từ registry → tuổi account theo ngày → scale cap (ví dụ d0-3: 25%, d4-7: 50%, d8-14: 75%, d15+: 100% — bảng ramp env-configurable hoặc chốt trong code). Kết hợp với 13.1: cap hiệu dụng = min(cap, cap × ramp). Engagement warm-up (like/follow ngẫu nhiên) là known gap — lanes chưa tồn tại, chỉ ghi Notes, không implement.
"""
verify = "Account mới 1 ngày tuổi + cap post=10 → chỉ được ~2 posts/ngày; account 30 ngày → full 10. Test bằng cách sửa `age` trong registry."
