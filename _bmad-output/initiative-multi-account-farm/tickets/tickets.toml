# Multi-account farm — epics in build order.

[[epic]]
id = 1
slug = "epic-write-lanes"
title = "Write lanes replay mutation"
description = "Doc-ids externalized ra config hot-reloadable; `agent-reach x post|reply|quote|thread` + media verify live qua replay; capture pipeline chuẩn hóa mở đường cho LinkedIn/Reddit/Instagram/TikTok."
covers = ["R1", "R2", "R3", "R4"]

[[epic]]
id = 2
slug = "epic-account-guardrails"
title = "Per-account guardrails"
description = "Write caps per-account per-day, warm-up ramp-up, proxy kill-switch fail-closed — enforce trong dispatch trước mọi write mà epic 1 tạo ra."
covers = ["R5", "R6", "R7"]
after = [{ epic = 1, needs = "X write actions để caps và kill-switch có cái để gate" }]

[[epic]]
id = 3
slug = "epic-fleet-orchestration"
title = "Container fleet orchestration"
description = "Container template per account + fleet manager health + re-login automation + ban-rate metrics; bake kill-switch contract của epic 2 vào container networking và health model."
covers = ["R8", "R9", "R10", "R11"]
after = [{ epic = 2, needs = "kill-switch contract và cap semantics để bake vào container template và health checks" }]

[[epic]]
id = 4
slug = "epic-farm-resilience"
title = "Farm resilience"
description = "XActions HTTP fallback, incident playbook, doc-id drift monitor — che chở các lane epic 1 đã build trên nền config epic 1 externalize."
covers = ["R12", "R13", "R14"]
after = [{ epic = 1, needs = "externalized doc-id config để probe drift và write lanes để fallback che chở" }, { epic = 2, needs = "enforcement path caps/kill-switch để fallback writes không bypass guardrails" }]
