# Multi-account farm — epics in build order.
# Epic ids 11-16: tránh trùng ref "x.y" với initiative-facebook-write đang build song song.

[[epic]]
id = 11
slug = "epic-account-substrate"
title = "Per-account substrate + contracts"
description = "Nền tảng chung: registry per-account (account↔proxy↔container↔session↔tuổi↔ledger↔status), contract danh tính per-run, và kill-switch contract 'zero egress ngoài proxy_i, fail-closed' — mọi epic sau đọc-ghi cùng 1 source of truth."
covers = ["R15"]

[[epic]]
id = 12
slug = "epic-write-lanes"
title = "Write lanes replay mutation"
description = "Doc-ids externalized ra config hot-reloadable; `agent-reach x post|reply|quote|thread` + media verify live qua replay trên designated test account; capture pipeline chuẩn hóa."
covers = ["R1", "R3", "R4"]
after = [{ epic = 11, needs = "registry + identity contract để write record đúng per-account từ ngày đầu" }]

[[epic]]
id = 13
slug = "epic-account-guardrails"
title = "Per-account guardrails"
description = "Write caps per-account per-day (ledger trong registry), warm-up ramp-up, kill-switch soft enforce ở dispatch theo contract của epic 11 — verify trên X write lane của epic 12."
covers = ["R5", "R6", "R7"]
after = [{ epic = 11, needs = "registry ledger + kill-switch contract + per-account proxy env" }, { epic = 12, needs = "1 live write action làm verify target cho caps/kill-switch (facebook_post thuộc initiative khác, không đếm)" }]

[[epic]]
id = 14
slug = "epic-fleet-orchestration"
title = "Container fleet orchestration"
description = "Container template per account + netns hard-enforce kill-switch contract + fleet manager health + re-login + ban-rate metrics; populate registry runtime fields; proven scale ≥4 container + runbook 2→N."
covers = ["R8", "R9", "R10", "R11"]
after = [{ epic = 11, needs = "registry schema để populate container↔account↔proxy mapping" }, { epic = 12, needs = "X write lane để Done-when 'x post từ trong container' verify được" }, { epic = 13, needs = "cap semantics và kill-switch contract để bake vào netns và health checks" }]

[[epic]]
id = 15
slug = "epic-platform-lanes"
title = "Platform lanes mở rộng"
description = "LinkedIn → Reddit → Instagram theo thứ tự ưu tiên farm, mỗi lane đi qua capture pipeline + doc-id config của epic 12; TikTok = spike quyết định riêng (chưa có cả read channel)."
covers = ["R2"]
after = [{ epic = 12, needs = "replay pattern + capture pipeline + doc-id config đã chứng minh trên X" }]

[[epic]]
id = 16
slug = "epic-farm-resilience"
title = "Farm resilience"
description = "XActions HTTP fallback (egress qua proxy account, không bypass guardrails), incident playbook walk-through trước mốc 20 account, host-level doc-id drift monitor."
covers = ["R12", "R13", "R14"]
after = [{ epic = 12, needs = "externalized doc-id config để probe drift và write lanes để fallback che chở" }, { epic = 13, needs = "enforcement path caps/kill-switch để fallback writes không bypass guardrails" }, { epic = 14, needs = "env per-account trong container template để wire fallback egress" }]
